<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 前沿资讯 - AI前沿</title>
  <meta name="description" content="汇聚全球人工智能最新资讯，追踪大模型、AI产品、技术研究与行业动态。" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://cc-newplayer.github.io/seo-farm/news.html" />
  <link rel="sitemap" type="application/xml" href="https://cc-newplayer.github.io/seo-farm/sitemap.xml" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AI 前沿资讯 - AI前沿" />
  <meta property="og:description" content="汇聚全球人工智能最新资讯，追踪大模型、AI产品、技术研究与行业动态。" />
  <meta property="og:url" content="https://cc-newplayer.github.io/seo-farm/news.html" />
  <meta property="og:site_name" content="AI前沿" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="切换导航">
    <span class="toggle-icon">&#10094;</span>
  </button>
  <nav class="sidebar-nav">
    <a href="index.html" class="sidebar-item" data-tooltip="首页">
      <span class="sidebar-icon">⚡</span>
      <span class="sidebar-label">首页</span>
    </a>
    <a href="news.html" class="sidebar-item active" data-tooltip="AI资讯">
      <span class="sidebar-icon">🔥</span>
      <span class="sidebar-label">AI资讯</span>
    </a>
    <a href="articles.html" class="sidebar-item" data-tooltip="AI科普">
      <span class="sidebar-icon">📚</span>
      <span class="sidebar-label">AI科普</span>
    </a>
  </nav>
</aside>

<div class="main-wrap" id="mainWrap">

<!-- ===== NAV ===== -->
<header class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">AI<span class="accent">前沿</span></span>
    </a>
    <nav class="nav-links">
      <div class="nav-dropdown">
        <span class="nav-dropdown-toggle">AI资讯 <span class="dropdown-arrow">▾</span></span>
        <div class="nav-dropdown-menu">
          <a href="news.html">最新资讯</a>
          <a href="articles.html">AI科普文章</a>
        </div>
      </div>
      <a href="index.html#tools">AI工具</a>
      <a href="index.html#updates">技术动态</a>
      <a href="index.html#models">模型榜单</a>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="menu">&#9776;</button>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="news.html" onclick="closeMobile()">最新资讯</a>
    <a href="articles.html" onclick="closeMobile()">AI科普文章</a>
    <a href="index.html#tools" onclick="closeMobile()">AI工具</a>
    <a href="index.html#updates" onclick="closeMobile()">技术动态</a>
    <a href="index.html#models" onclick="closeMobile()">模型榜单</a>
  </div>
</header>

<!-- ===== NEWS ===== -->
<section class="section" style="padding-top: 80px;">
  <div class="container">
    <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:0.875rem;text-decoration:none;margin-bottom:32px;">← 返回首页</a>
    <div class="section-header">
      <h2 class="section-title">🔥 AI 前沿资讯</h2>
      <div class="filter-tabs" id="newsTabs">
        <button class="tab active" data-filter="all">全部</button>
        <button class="tab" data-filter="model">大模型</button>
        <button class="tab" data-filter="product">产品</button>
        <button class="tab" data-filter="research">研究</button>
        <button class="tab" data-filter="industry">行业</button>
      </div>
    </div>
    <div class="news-grid" id="newsGrid"></div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">AI<span class="accent">前沿</span></span>
    </div>
    <p class="footer-copy">© 2026 AI前沿 · 数据持续更新中</p>
  </div>
</footer>

</div><!-- /.main-wrap -->

<!-- ===== ARTICLE MODAL ===== -->
<div class="article-modal" id="articleModal" onclick="if(event.target===this)closeArticle()">
  <div class="article-panel">
    <button class="article-close" onclick="closeArticle()" aria-label="关闭">✕</button>
    <div class="article-body" id="articleBody"></div>
  </div>
</div>

<script src="script.js"></script>
<script>
  // 覆盖 init：news 页只渲染 news
  renderNews('all');
  setupTabs('newsTabs', renderNews);

  // 侧边栏折叠
  if (localStorage.getItem('sidebarCollapsed') === 'true') {
    document.body.classList.add('sidebar-collapsed');
  }
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    const c = document.body.classList.toggle('sidebar-collapsed');
    localStorage.setItem('sidebarCollapsed', c);
  });

  // 下拉菜单
  document.querySelector('.nav-dropdown-toggle').addEventListener('click', function(e) {
    e.stopPropagation();
    this.closest('.nav-dropdown').classList.toggle('open');
  });
  document.addEventListener('click', function() {
    document.querySelectorAll('.nav-dropdown.open').forEach(el => el.classList.remove('open'));
  });

  // 汉堡菜单
  function closeMobile() { document.getElementById('mobileMenu').classList.remove('open'); }
  document.getElementById('hamburger').addEventListener('click', () => {
    document.getElementById('mobileMenu').classList.toggle('open');
  });
</script>
</body>
</html>
