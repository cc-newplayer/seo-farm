const coverStyle = {
  tutorial: 'linear-gradient(135deg,#0d9488,#10b981)',
  deep:       'linear-gradient(135deg,#7c3aed,#8b5cf6)',
  popular:    'linear-gradient(135deg,#ea580c,#fb923c)',
  comparison: 'linear-gradient(135deg,#0369a1,#38bdf8)',
};
const coverIcon  = { tutorial: '📘', deep: '🔬', popular: '🌐', comparison: '⚖️' };
const tagName    = { tutorial: '教程', deep: '深度科普', popular: '大众科普', comparison: '横评对比' };

function renderArticles(filter) {
  const filtered = filter === 'all' ? articlesData : articlesData.filter(a => a.category === filter);
  document.getElementById('articlesGrid').innerHTML = filtered.map(a => {
    const coverHtml = a.img
      ? `<img src="${a.img}" alt="" loading="lazy" class="art-cover-img">`
      : `<div class="art-cover" style="background:${coverStyle[a.category]}">${coverIcon[a.category]}</div>`;
    return `<a class="art-item" href="articles/${a.file}" target="_blank">
      <div class="art-cover-wrap">${coverHtml}</div>
      <div class="art-item-body">
        <div class="art-item-meta">
          <span class="art-item-tag tag-${a.category}">${tagName[a.category]}</span>
        </div>
        <div class="art-item-title">${a.title}</div>
        <div class="art-item-desc">${a.desc}</div>
      </div>
    </a>`;
  }).join('');
}

function renderTabs(activeFilter) {
  const counts = {
    all:      articlesData.length,
    tutorial:   articlesData.filter(a => a.category === 'tutorial').length,
    deep:       articlesData.filter(a => a.category === 'deep').length,
    popular:    articlesData.filter(a => a.category === 'popular').length,
    comparison: articlesData.filter(a => a.category === 'comparison').length,
  };
  const tabs = [
    { key: 'all',      label: '全部' },
    { key: 'tutorial',   label: '教程' },
    { key: 'deep',       label: '深度科普' },
    { key: 'popular',    label: '大众科普' },
    { key: 'comparison', label: '横评对比' },
  ];
  document.getElementById('articleTabs').innerHTML = tabs.map(t =>
    `<button class="art-tab${activeFilter === t.key ? ' active' : ''}" data-filter="${t.key}">
      ${t.label}<span class="art-tab-count">${counts[t.key]}</span>
    </button>`
  ).join('');
}

function renderHotArticles() {
  const hotIds = [39, 38, 37, 36, 35];
  const hot = hotIds.map(id => articlesData.find(a => a.id === id)).filter(Boolean);
  document.getElementById('hotArticlesList').innerHTML = hot.map(a => {
    const thumbHtml = a.img
      ? `<img src="${a.img}" alt="" loading="lazy">`
      : `<div class="hot-thumb-placeholder" style="background:${coverStyle[a.category]}">${coverIcon[a.category]}</div>`;
    return `<a class="hot-item" href="articles/${a.file}" target="_blank">
      <div class="hot-thumb">${thumbHtml}</div>
      <span class="hot-item-title">${a.title}</span>
    </a>`;
  }).join('');
}

// 侧边栏折叠
document.getElementById('sidebarToggle').addEventListener('click', () => document.body.classList.toggle('sidebar-collapsed'));

// tab 切换
document.getElementById('articleTabs').addEventListener('click', e => {
  const btn = e.target.closest('.art-tab');
  if (!btn) return;
  renderTabs(btn.dataset.filter);
  renderArticles(btn.dataset.filter);
});

// 汉堡菜单
function closeMobile() { document.getElementById('mobileMenu').classList.remove('open'); }
document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('mobileMenu').classList.toggle('open');
});

renderTabs('all');
renderArticles('all');
renderHotArticles();
</script>
<script src="animations.js"></script>
</body>
